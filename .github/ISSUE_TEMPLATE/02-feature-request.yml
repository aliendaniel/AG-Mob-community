name: Feature Request / 功能请求
description: 提交一个清晰、可评估的功能请求
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        如果只是早期想法，建议优先发到 Discussions / Ideas，方便大家一起讨论。这个表单适合已经比较明确、可评估的功能请求。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issues 和 Discussions，确认没有明显重复。
          required: true
        - label: 这个请求不包含私密信息、商业敏感信息或安全漏洞细节。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述你在什么场景下遇到了什么限制或不便。
      placeholder: "当我 ... 时，我希望能 ..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议的解决方案
      description: 你希望产品如何支持这个场景？
      placeholder: "可以增加 ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      placeholder: "目前我用 ... 临时解决，但 ..."
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: 重要程度
      options:
        - 高：影响核心使用流程
        - 中：明显提升体验或效率
        - 低：锦上添花
    validations:
      required: true

  - type: textarea
    id: extra-context
    attributes:
      label: 补充信息
      description: 可以添加截图、示例、相关场景或其他说明。
      placeholder: "其他想补充的内容。"
    validations:
      required: false
