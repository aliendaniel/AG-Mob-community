name: Feature Request / 功能请求
description: Suggest a clear, user-facing improvement
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        If this is an early idea, Discussions / Ideas may be a better place to start. Use this form when the request is already clear enough to evaluate.

        中文：如果只是早期想法，建议优先发到 Discussions / Ideas。这个表单适合已经比较明确、可评估的功能请求。

  - type: checkboxes
    id: precheck
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing Issues and Discussions for duplicates. / 我已搜索过已有 Issues 和 Discussions，确认没有明显重复。
          required: true
        - label: This request does not include private data, credentials, or security details. / 这个请求不包含私密信息、凭据或安全漏洞细节。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 想解决的问题
      description: What workflow, limitation, or user pain does this address?
      placeholder: "When I ..., I want to ..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution / 建议的解决方案
      description: How should AG Mob support this scenario?
      placeholder: "Add / improve / change ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 你考虑过的替代方案
      placeholder: "Today I work around it by ..."
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: Importance / 重要程度
      options:
        - "High: blocks or seriously affects my workflow / 高：影响核心使用流程"
        - "Medium: would noticeably improve the experience / 中：明显提升体验或效率"
        - "Low: nice-to-have improvement / 低：锦上添花"
    validations:
      required: true

  - type: textarea
    id: extra-context
    attributes:
      label: Extra context / 补充信息
      description: Screenshots, examples, related workflows, or other details.
      placeholder: "Anything else that helps explain the request."
    validations:
      required: false
