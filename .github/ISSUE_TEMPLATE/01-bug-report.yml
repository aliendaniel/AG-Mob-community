name: Bug 报告
description: 报告一个可复现的问题或异常行为
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮助我们定位问题。请尽量提供可复现的信息；如果涉及账号、订单、Token、日志密钥或隐私数据，请不要公开发布。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issues，确认这不是明显重复问题。
          required: true
        - label: 这不是安全漏洞或隐私风险；如果是，我会发送到 SECURITY_EMAIL。
          required: true

  - type: input
    id: platform-device
    attributes:
      label: 平台与设备
      description: 例如 iPhone 15 Pro、iPad、Android 设备型号等。
      placeholder: "iPhone 15 Pro"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App 版本
      placeholder: "例如 1.0.0"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: "例如 iOS 17.5 / Android 14"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出如何触发问题。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: "你原本期望发生什么？"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: "实际发生了什么？是否有错误提示？"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件与补充信息
      description: 可以添加截图、录屏、日志片段或其他上下文。请先移除敏感信息。
      placeholder: "拖拽图片/录屏到这里，或补充更多信息。"
    validations:
      required: false
