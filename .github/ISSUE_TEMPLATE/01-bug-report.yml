name: Bug Report / Bug 反馈
description: Report a reproducible issue in OpenClaw Mobile
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve OpenClaw Mobile.

        Please do not post setup codes, device tokens, API keys, account data, private logs, or other sensitive information.

        中文：感谢你帮助我们定位问题。请不要公开发布 Setup Code、设备 token、API Key、账号信息、私密日志或其他敏感信息。

  - type: checkboxes
    id: precheck
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing Issues and did not find an obvious duplicate. / 我已搜索过已有 Issues，确认没有明显重复。
          required: true
        - label: This is not a security or privacy issue. Security reports go to SECURITY_EMAIL. / 这不是安全或隐私问题；如果是，我会发送到 SECURITY_EMAIL。
          required: true

  - type: input
    id: platform-device
    attributes:
      label: Platform and device / 平台与设备
      description: "Example: iPhone 15 Pro, iPad Pro, iPad mini."
      placeholder: "iPhone 15 Pro"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version / App 版本
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / 系统版本
      placeholder: "iOS 17.5 / iPadOS 17.5"
    validations:
      required: true

  - type: dropdown
    id: connection-type
    attributes:
      label: Gateway connection type / Gateway 连接方式
      options:
        - "LAN / 局域网"
        - "Tailscale"
        - "Hosted HTTPS/WSS URL / 托管安全地址"
        - "Not connected yet / 尚未连接"
        - "Other / 其他"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Please list the exact steps that trigger the issue.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result / 期望结果
      placeholder: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      placeholder: "What actually happened? Include visible error text if any."
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments and extra context / 附件与补充信息
      description: Screenshots, recordings, safe logs, or additional context. Please redact sensitive information first.
      placeholder: "Drag screenshots or recordings here, or add more context."
    validations:
      required: false
