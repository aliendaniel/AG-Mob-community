title: "[Announcement] "
labels: ["announcement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for product announcements, release notes, maintenance notices, and important community updates.

        中文：用于产品公告、版本更新、维护通知或重要社区消息。请优先写用户真正需要知道的信息。

  - type: input
    id: summary
    attributes:
      label: Summary / 摘要
      placeholder: "One sentence about the update"
    validations:
      required: true

  - type: dropdown
    id: announcement-type
    attributes:
      label: Type / 类型
      options:
        - "Release notes / 版本更新"
        - "Known issue / 已知问题"
        - "Service status / 服务状态"
        - "Community notice / 社区通知"
        - "Other / 其他"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details / 详细内容
      description: Explain what changed, who is affected, and what users should do.
      placeholder: |
        ## What changed

        ## Who is affected

        ## What users should do
    validations:
      required: true

  - type: input
    id: related-links
    attributes:
      label: Related links / 相关链接
      placeholder: "Related Issue, Discussion, release, or support link"
    validations:
      required: false
