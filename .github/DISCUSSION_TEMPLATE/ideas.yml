title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Share product ideas here. The more concrete the workflow, the easier it is to evaluate.

        中文：欢迎分享产品想法。场景越具体，越容易讨论和评估。

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow / 问题或场景
      placeholder: "When I ..., the current flow is difficult because ..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea / 你的建议
      placeholder: "I wish AG Mob could ..."
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most? / 主要影响谁
      options:
        - "New users / 新用户"
        - "Power users / 高频用户"
        - "Beta testers / Beta 测试者"
        - "Everyone / 所有用户"
        - "Not sure / 不确定"
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: Importance to you / 对你的重要程度
      options:
        - "High: I need this for my workflow / 高：没有它会明显影响使用"
        - "Medium: it would make the app easier to use / 中：有它会更顺手"
        - "Low: nice polish / 低：体验优化"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 现在的替代方式
      placeholder: "Today I work around this by ..."
    validations:
      required: false
