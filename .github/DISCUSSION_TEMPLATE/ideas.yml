title: "[想法] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享产品想法。越具体的场景越容易被评估和讨论。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或场景
      placeholder: "当我 ... 时，目前不太方便，因为 ..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你的建议
      placeholder: "我希望可以 ..."
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: 这个想法主要影响谁
      options:
        - 新用户
        - 高频用户
        - Beta 测试者
        - 所有用户
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: 对你的重要程度
      options:
        - 高：没有它会明显影响使用
        - 中：有它会更顺手
        - 低：不错的体验优化
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代方式
      placeholder: "目前我会通过 ... 来临时解决。"
    validations:
      required: false
